[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-for-cloud-api"
version = "0.1.0"
description = "API modulaire du prototype AI for Cloud"
requires-python = ">=3.12,<4"
dependencies = [
  "fastapi[standard]>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "supabase>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
